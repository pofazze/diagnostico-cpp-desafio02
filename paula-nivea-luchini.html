<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Diagnóstico CPP · acesso restrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0908;--gold:#c9a24b;--gold2:#e7c97a;--ink:#f3efe6;--soft:#9b9588;--line:rgba(201,162,75,.18);--red:#e0726a}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  body{background:radial-gradient(1100px 560px at 50% -12%, rgba(201,162,75,.16), transparent 60%), var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}
  .card{width:100%;max-width:430px;background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.012));border:1px solid var(--line);border-radius:24px;padding:46px 38px;backdrop-filter:blur(20px);box-shadow:0 40px 100px rgba(0,0,0,.65)}
  .brand{display:flex;align-items:center;gap:13px;margin-bottom:34px}
  .mark{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-family:'Crimson Pro',serif;font-weight:700;color:#1a1305;font-size:20px;letter-spacing:-.5px;box-shadow:0 8px 22px rgba(201,162,75,.3)}
  .bname{font-family:'Crimson Pro',serif;font-weight:700;font-size:19px;letter-spacing:.2px}
  .bname span{color:var(--gold2)}
  .lock{display:flex;align-items:center;gap:8px;background:rgba(201,162,75,.08);border:1px solid var(--line);padding:10px 13px;border-radius:10px;font-size:12px;color:var(--gold2);margin-bottom:22px}
  h1{font-family:'Crimson Pro',serif;font-weight:700;font-size:24px;margin-bottom:8px}
  p{color:var(--soft);font-size:14px;margin-bottom:26px;line-height:1.55}
  label{display:block;font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:1.6px;margin-bottom:8px;font-weight:700}
  input{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:15px 16px;color:var(--ink);font-family:inherit;font-size:15px;margin-bottom:18px;transition:.2s}
  input:focus{outline:none;border-color:var(--gold);background:rgba(201,162,75,.06);box-shadow:0 0 0 4px rgba(201,162,75,.1)}
  button{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:12px;padding:16px;color:#1a1305;font-family:'Crimson Pro',serif;font-weight:700;font-size:15px;cursor:pointer;letter-spacing:.3px;transition:transform .15s, box-shadow .2s;margin-top:6px;text-transform:uppercase}
  button:hover{transform:translateY(-1px);box-shadow:0 14px 36px rgba(201,162,75,.38)}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:var(--red);font-size:13px;margin-top:13px;min-height:18px}
  .foot{text-align:center;color:#6f685a;font-size:11px;margin-top:26px;text-transform:uppercase;letter-spacing:1.6px}
  .spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#1a1305;border-radius:50%;animation:s .8s linear infinite;display:inline-block}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="mark">CPP</div><div class="bname">Cirurgião Particular <span>Premium</span></div></div>
    <div class="lock">🔒 Conteúdo criptografado · AES-256-GCM</div>
    <h1>Diagnóstico individual</h1>
    <p>Material restrito da Mentoria CPP. Acesso protegido — informe a senha.</p>
    <form id="f" autocomplete="off">
      <label for="p">Senha de acesso</label>
      <input type="password" id="p" autocomplete="current-password" required autofocus />
      <button type="submit" id="b">Desbloquear</button>
      <div class="err" id="err"></div>
    </form>
    <div class="foot">Patrick Suyti · Dr. Mateus Jerônimo</div>
  </div>
